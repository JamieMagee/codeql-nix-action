name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan-testbed:
    name: Scan codeql-nix-testbed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the testbed
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: JamieMagee/codeql-nix-testbed

      - name: Checkout this action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./codeql-nix-action

      - name: Run codeql-nix-action against the testbed
        uses: ./codeql-nix-action
        with:
          source-root: nix
          category: codeql-nix-smoke-test
          upload: "false"

      - name: Verify SARIF was produced
        run: |
          set -euo pipefail
          ls -la codeql-nix-results.sarif
          jq -r '"Rules with findings: " + (.runs[0].results | map(.ruleId) | unique | length | tostring)' codeql-nix-results.sarif
          jq -r '.runs[0].results | length as $n | "Total findings: \($n)"' codeql-nix-results.sarif
          # The testbed contains 2 planted unpinned fetches; expect >=2 findings.
          n=$(jq -r '.runs[0].results | length' codeql-nix-results.sarif)
          if [[ "$n" -lt 2 ]]; then
            echo "Expected >=2 findings on the testbed, got $n"
            exit 1
          fi
